<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر المنتجات المنظم</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
<style>
        :root { 
            --primary: #2c3e50; 
            --accent: #3498db;
            --price: #2ecc71; 
            --bg: #f5f6fa; 
        }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        
        .header-section { text-align: center; margin-bottom: 25px; }
        h1 { color: var(--primary); font-size: 1.8rem; margin-bottom: 15px; }
        
        .search-box { width: 100%; max-width: 450px; padding: 12px 20px; font-size: 16px; border: 2px solid #ddd; border-radius: 25px; outline: none; transition: 0.3s; box-sizing: border-box; }
        .search-box:focus { border-color: var(--accent); }
        
        /* تصميم أزرار الأقسام */
        .categories-container { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 20px auto; max-width: 800px; }
        .cat-btn { background: white; border: 2px solid #ddd; padding: 8px 18px; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s; color: var(--primary); }
        .cat-btn.active, .cat-btn:hover { background: var(--accent); color: white; border-color: var(--accent); }
        
        /* شبكة المنتجات الاحترافية المانعة للتداخل */
        .products-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 25px; 
            max-width: 1200px; 
            margin: 30px auto; 
            padding: 10px;
        }
        .card { 
            background: white; 
            border-radius: 12px; 
            overflow: hidden; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.06); 
            display: flex; 
            flex-direction: column; 
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-5px); }
        .card img { 
            width: 100%; 
            height: 250px; 
            object-fit: cover; 
            background: #eaedf1;
            display: block;
        }
        .info { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
        .title { font-size: 17px; font-weight: bold; margin: 0 0 10px 0; color: #333; }
        .price { font-size: 19px; color: var(--price); font-weight: bold; margin-bottom: 10px; }
        .note { font-size: 13px; color: #7f8c8d; background: #f8f9fa; padding: 8px; border-radius: 6px; margin: 0; min-height: 35px; }
        .no-results { text-align: center; grid-column: 1/-1; color: #7f8c8d; font-size: 16px; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="header-section">
        <h1>متجرنا الإلكتروني</h1>
        <input type="text" id="search" class="search-box" placeholder="ابحث عن منتج بالاسم...">
        
        <div class="categories-container" id="categories-list"></div>
    </div>

    <div class="products-grid" id="grid">
        <p style="text-align: center; grid-column: 1/-1;">جاري تحميل وتصنيف المنتجات...</p>
    </div>

    <script>
        // رابط الـ CSV من جوجل درايف
const googleSheetCSVUrl = "https://docs.google.com/spreadsheets/d/1kB3nZ_C80k0r8bog56BE3WlfrQwXnxacWFTSIaQpMIQ/export?format=csv&gid=1382200989";
        
        let allProducts = [];
        let currentCategory = "الكل";
        let searchQuery = "";

        // تعريف أسماء الأعمدة الأساسية المتطابقة مع جدولك
        const KEY_NAME = "اسم المنتج";      
        const KEY_CAT = "القسم";          
        const KEY_PRICE = "سعر المنتج";            
        const KEY_IMAGE = "صورة المنتج";    
        const KEY_NOTE = "ملاحظات المنتج";            

        function loadProducts() {
            Papa.parse(googleSheetCSVUrl, {
                download: true,
                header: true,
                complete: function(results) {
                    // فلترة الأسطر للتأكد من وجود اسم للمنتج
                    allProducts = results.data.filter(p => p[KEY_NAME]); 
                    generateCategoryButtons();
                    filterAndDisplay();
                }
            });
        }

        // إنشاء أزرار الأقسام تلقائياً
        function generateCategoryButtons() {
            const catContainer = document.getElementById('categories-list');
            
            let categories = new Set();
            allProducts.forEach(p => {
                if(p[KEY_CAT]) categories.add(p[KEY_CAT].trim());
            });

            let buttonsHTML = `<button class="cat-btn active" onclick="filterByCat('الكل', this)">الكل</button>`;
            categories.forEach(cat => {
                buttonsHTML += `<button class="cat-btn" onclick="filterByCat('${cat}', this)">${cat}</button>`;
            });
            
            catContainer.innerHTML = buttonsHTML;
        }

        // عند الضغط على زر القسم
        function filterByCat(category, buttonElement) {
            currentCategory = category;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');
            filterAndDisplay();
        }

        // دالة الفلترة
        function filterAndDisplay() {
            let filtered = allProducts;

            if (currentCategory !== "الكل") {
                filtered = filtered.filter(p => p[KEY_CAT] && p[KEY_CAT].trim() === currentCategory);
            }

            if (searchQuery !== "") {
                filtered = filtered.filter(p => p[KEY_NAME] && p[KEY_NAME].toLowerCase().includes(searchQuery));
            }

            displayProducts(filtered);
        }

function displayProducts(products) {
            const grid = document.getElementById('grid');
            grid.innerHTML = "";
            
            if(products.length === 0) {
                grid.innerHTML = '<div class="no-results">لم يتم العثور على منتجات في هذا القسم.</div>';
                return;
            }

            products.forEach(p => {
                let rawImg = p[KEY_IMAGE] || "";
                let imgUrl = "";
                let id = "";
                
                // دالة ذكية ومطورة لاستخراج الـ ID بدقة مهما كان شكل الرابط الجديد
                if (rawImg.includes("id=")) {
                    let parts = rawImg.split("id=");
                    if (parts[1]) {
                        // قص أي إضافات تأتي بعد الـ ID مثل &usp=drivesdk
                        id = parts[1].split("&")[0]; 
                    }
                } else if (rawImg.includes("/d/")) {
                    let parts = rawImg.split("/d/");
                    if (parts[1]) {
                        id = parts[1].split("/")[0];
                    }
                }

                // تنظيف الـ ID من أي مساحات فارغة قد تسبب كسر الرابط
                if (id) {
                    id = id.trim();
                    // استخدام رابط الـ thumbnail السريع والمضمون بحجم w600 مناسب جداً للكروت
                    imgUrl = "https://drive.google.com/thumbnail?sz=w600&id=" + id;
                }

                // بناء كارت المنتج نصياً بشكل آمن تماماً يمنع تداخل الكروت
                let cardHTML = '<div class="card">';
                if(imgUrl !== "") {
                    cardHTML += '<img src="' + imgUrl + '" alt="' + (p[KEY_NAME] || '') + '" loading="lazy" onerror="this.style.display=\'none\';">';
                } else {
                    cardHTML += '<div style="width:100%; height:240px; background:#eaedf1; display:flex; align-items:center; justify-content:center; color:#7f8c8d;">لا توجد صورة</div>';
                }
                cardHTML += '<div class="info">';
                cardHTML += '<div class="title">' + (p[KEY_NAME] || '') + '</div>';
                cardHTML += '<div class="price">' + (p[KEY_PRICE] || '') + '</div>';
                cardHTML += '<p class="note">' + (p[KEY_NOTE] || 'لا توجد ملاحظات') + '</p>';
                cardHTML += '</div></div>';

                grid.innerHTML += cardHTML;
            });
        }

        // الاستماع لخانة البحث
        document.getElementById('search').addEventListener('input', function(e) {
            searchQuery = e.target.value.toLowerCase();
            filterAndDisplay();
        });

        // تشغيل جلب البيانات
        loadProducts();
    </script>
</body>
</html>
